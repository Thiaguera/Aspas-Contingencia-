name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect aspas.md Content
        run: |
          echo "=== VERIFICANDO O ASPAS.MD ==="
          if [ -f "aspas.md" ]; then
            echo "Tamanho do ficheiro:"
            ls -lh aspas.md
            echo "Primeiras 20 linhas do aspas.md:"
            head -n 20 aspas.md
          else
            echo "ERRO: O ficheiro aspas.md não existe na raiz do repositório!"
            exit 1
          fi

      - name: Unpack, Setup Gradle and Build APK
        run: |
          python3 -c '
          import os, urllib.request, zipfile, subprocess, base64

          print("A ler o aspas.md linha a linha...")
          with open("aspas.md", "r", encoding="utf-8", errors="ignore") as f:
              lines = f.readlines()

          current_file = None
          code_buffer = []
          in_block = False
          count = 0

          for line in lines:
              stripped = line.strip()
              if stripped.startswith("```"):
                  if in_block:
                      if current_file:
                          current_path = current_file.strip()
                          os.makedirs(os.path.dirname(current_path) if os.path.dirname(current_path) else ".", exist_ok=True)
                          with open(current_path, "w", encoding="utf-8") as out:
                              out.writelines(code_buffer)
                          print(f"Extraído com sucesso: {current_path}")
                          count += 1
                      current_file = None
                      code_buffer = []
                      in_block = False
                  else:
                      in_block = True
                      parts = stripped.split()
                      if len(parts) > 1:
                          current_file = parts[-1]
              elif in_block:
                  code_buffer.append(line)
              else:
                  if stripped and not stripped.startswith("#") and ("/" in stripped or "." in stripped):
                      current_file = stripped

          print(f"Total de ficheiros extraídos pelo script: {count}")

          # Localizar o projeto
          project_dir = "."
          for root, dirs, files in os.walk("."):
              if "settings.gradle" in files or "settings.gradle.kts" in files:
                  project_dir = root
                  break

          print(f"Diretório do projeto detetado: {project_dir}")
          os.chdir(project_dir)

          print("A descarregar o Gradle 8.9...")
          encoded_url = "aHR0cHM6Ly9zZXJ2aWNlcy5ncmFkbGUub3JnL2Rpc3RyaWJ1dGlvbnMvZ3JhZGxlLTguOS1iaW4uemlw"
          target_url = base64.b64decode(encoded_url).decode("utf-8")
          urllib.request.urlretrieve(target_url, "gradle-8.9-bin.zip")

          with zipfile.ZipFile("gradle-8.9-bin.zip", "r") as zip_ref:
              zip_ref.extractall(".")

          gradle_bin = os.path.abspath("gradle-8.9/bin/gradle")
          if os.path.exists(gradle_bin):
              os.chmod(gradle_bin, 0o755)

          subprocess.run([gradle_bin, "wrapper", "--gradle-version", "8.9"], check=True)
          if os.path.exists("gradlew"):
              os.chmod("gradlew", 0o755)

          subprocess.run(["./gradlew", "assembleDebug", "--no-daemon"], check=True)
          '

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/app/build/outputs/apk/debug/*.apk'
