name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Parse aspas.md to extract project files
        run: |
          python3 << 'EOF'
          import os

          print("--- A ler e processar o aspas.md ---")
          if not os.path.exists("aspas.md"):
              print("ERRO: aspas.md nao encontrado!")
              exit(1)

          with open("aspas.md", "r", encoding="utf-8", errors="ignore") as f:
              full_text = f.read()

          marker = "============ BUILD FILES ============"
          if marker in full_text:
              full_text = full_text[full_text.find(marker):]

