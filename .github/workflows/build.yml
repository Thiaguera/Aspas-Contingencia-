name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Unpack, Setup Gradle and Build APK
        run: |
          python3 -c '
          import os, re, urllib.request, zipfile, subprocess

          with open("aspas.md", "r", encoding="utf-8") as f:
              content = f.read()

          blocks = re.split(r"\n(?=[\w\/\.\-]+\n```)", content)
          for b in blocks:
              lines = b.strip().split("\n")
              if len(lines) >= 2 and lines[1].startswith("```"):
                filepath = lines[0].strip()
                code_lines = lines[2:]
                if code_lines and code_lines[-1].startswith("```"):
                    code_lines = code_lines[:-1]
                
                os.makedirs(os.path.dirname(filepath), exist_ok=True)
                with open(filepath, "w", encoding="utf-8") as out:
                    out.write("\n".join(code_lines) + "\n")
                print(f"Created: {filepath}")

          print("Downloading Gradle 8.9...")
          target_url = "[https://services.gradle.org/distributions/gradle-8.9-bin.zip](https://services.gradle.org/distributions/gradle-8.9-bin.zip)"
          urllib.request.urlretrieve(target_url, "gradle-8.9-bin.zip")

          print("Unzipping Gradle...")
          with zipfile.ZipFile("gradle-8.9-bin.zip", "r") as zip_ref:
              zip_ref.extractall(".")

          gradle_bin = os.path.abspath("gradle-8.9/bin/gradle")
          print("Generating Gradle Wrapper...")
          subprocess.run([gradle_bin, "wrapper", "--gradle-version", "8.9"], check=True)

          os.chmod("gradlew", 0o755)

          print("Building Debug APK...")
          subprocess.run(["./gradlew", "assembleDebug", "--no-daemon"], check=True)
          '

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
