name: Recovery Build APK
on:
  workflow_dispatch:
  push:
    branches: [recovery/native-stage12]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build isolated recovery APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :core:data:testDebugUnitTest :core:data:compileDebugAndroidTestKotlin --stacktrace --no-daemon --max-workers 1
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: aspas-recovery-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
