name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Unpack, Setup Gradle and Build APK
        run: |
          python3 -c '
          import os, urllib.request, zipfile, subprocess, base64, re

          print("--- Unpacking aspas.md ---")
          with open("aspas.md", "r", encoding="utf-8") as f:
              content = f.read()

          blocks = re.findall(r"([^\n]+\n)?```[^\n]*\n(.*?)```", content, re.DOTALL)
          
          for header, code in blocks:
              filepath = ""
              if header:
                  filepath = header.strip().split()[0]
              
              if not filepath:
                  continue
              
              dir_name = os.path.dirname(filepath)
              if dir_name:
                  os.makedirs(dir_name, exist_ok=True)
              
              with open(filepath, "w", encoding="utf-8") as out:
                  out.write(code)
              print(f"Created: {filepath}")

          # Localizar dinamicamente onde ficou o projeto (procura por settings.gradle)
          project_dir = "."
          for root, dirs, files in os.walk("."):
              if "settings.gradle" in files or "settings.gradle.kts" in files:
                  project_dir = root
                  break

          print(f"Project directory found at: {project_dir}")
          os.chdir(project_dir)

          print("Downloading Gradle 8.9...")
          encoded_url = "aHR0cHM6Ly9zZXJ2aWNlcy5ncmFkbGUub3JnL2Rpc3RyaWJ1dGlvbnMvZ3JhZGxlLTguOS1iaW4uemlw"
          target_url = base64.b64decode(encoded_url).decode("utf-8")
          urllib.request.urlretrieve(target_url, "gradle-8.9-bin.zip")

          print("Unzipping Gradle...")
          with zipfile.ZipFile("gradle-8.9-bin.zip", "r") as zip_ref:
              zip_ref.extractall(".")

          gradle_bin = os.path.abspath("gradle-8.9/bin/gradle")
          if os.path.exists(gradle_bin):
              os.chmod(gradle_bin, 0o755)

          print("Generating Gradle Wrapper...")
          subprocess.run([gradle_bin, "wrapper", "--gradle-version", "8.9"], check=True)

          if os.path.exists("gradlew"):
              os.chmod("gradlew", 0o755)

          print("Building Debug APK...")
          subprocess.run(["./gradlew", "assembleDebug", "--no-daemon"], check=True)
          '

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/app/build/outputs/apk/debug/*.apk'
