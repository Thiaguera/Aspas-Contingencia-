name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Project Structure from aspas.md
        run: |
          python3 -c '
          import os, re

          with open("aspas.md", "r", encoding="utf-8") as f:
              content = f.read()

          blocks = re.split(r"\n(?=[\w\/\.\-]+\n```)", content)
          for b in blocks:
              lines = b.strip().split("\n")
              if len(lines) >= 2 and lines[1].startswith("```"):
                filepath = lines[0].strip()
                code_lines = lines[2:]
                if code_lines and code_lines[-1].startswith("```"):
                    code_lines = code_lines[:-1]
                
                os.makedirs(os.path.dirname(filepath), exist_ok=True)
                with open(filepath, "w", encoding="utf-8") as out:
                    out.write("\n".join(code_lines) + "\n")
                print(f"Created: {filepath}")
          '

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Generate Gradle Wrapper and Build APK
        run: |
          curl -L -O [https://services.gradle.org/distributions/gradle-8.9-bin.zip](https://services.gradle.org/distributions/gradle-8.9-bin.zip)
          unzip -q gradle-8.9-bin.zip
          export PATH=$PWD/gradle-8.9/bin:$PATH
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
