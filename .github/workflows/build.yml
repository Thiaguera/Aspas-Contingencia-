name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle and Build APK
        run: |
          # Entrar diretamente na pasta do projeto Android
          cd android-direct-print

          echo "A descarregar o Gradle 8.9..."
          URL="https://services.gradle.org/distributions/gradle-8.9-bin.zip"
          curl -L -o gradle-8.9-bin.zip "$URL"

          echo "A descompactar o Gradle..."
          unzip -q gradle-8.9-bin.zip

          echo "A gerar o Gradle Wrapper..."
          ./gradle-8.9/bin/gradle wrapper --gradle-version 8.9

          chmod +x gradlew

          echo "A compilar o APK Debug..."
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/app/build/outputs/apk/debug/*.apk'
