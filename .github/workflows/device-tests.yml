name: Recovery Android validation
on:
  workflow_dispatch:
  push:
    branches: [recovery/native-integration]
permissions:
  contents: read
jobs:
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Enable KVM
        run: |
          echo KERNEL==\"kvm\",GROUP=\"kvm\",MODE=\"0666\",OPTIONS+=\"static_node=kvm\" | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify wrapper
        run: |
          chmod +x gradlew
          curl -fL https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          echo "498495120a03b9a6ab5d155f5de3c8f0d986a449153702fb80fc80e134484f17  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew :core:data:connectedDebugAndroidTest --stacktrace --no-daemon --max-workers 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-android-test-results
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
